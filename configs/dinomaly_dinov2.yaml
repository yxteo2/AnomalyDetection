# Compact Dinomaly-style variant, not the original paper's complete recipe.
dataset:
  path: ../data/MVTec
  category: bottle
model:
  name: dinomaly
  backbone: dinov2_vits14
  pretrained: true
  image_size: [512, 512]
  crop_scale: 1.0
  params:
    dino_layers: [2, 5, 8, 11]
    backbone_precision: bfloat16
    decoder_depth: 4
    bottleneck_dropout: 0.2
    gradient_checkpointing: true
loss:
  name: cosine  # cosine | mse | smooth_l1 | cosine_mse
training:
  device: cuda
  batch_size: 1
  accumulate_grad_batches: 4
  epochs: 100
  num_workers: 0
  learning_rate: 0.0001
evaluation:
  num_visualizations: 0
output:
  save_dir: ../checkpoints
  run_name: dinomaly_dino_512_cosine
